<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
    <meta charset="UTF-8">
    <title>{{NAME}} - {{ROLE}}</title>
    {{FONT_LINK}}
    <style>
        @page { size: A4; margin: 1.6cm 1.8cm; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #1D1D1F; line-height: 1.55; -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header { display: flex; align-items: center; gap: 24px; margin-bottom: 22px; }
        .avatar { width: 88px; height: 88px; border-radius: 20px; object-fit: cover; flex-shrink: 0; }
        .header-info { flex: 1; }
        .name { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 5px; }
        .role-line { font-size: 14px; color: #86868B; margin-bottom: 8px; }
        .role-line strong { color: #1D1D1F; font-weight: 600; }
        .contact-line { font-size: 12px; color: #86868B; }
        .contact-line a { color: #0071E3; text-decoration: none; }
        .divider { color: #D2D2D7; margin: 0 6px; }

        /* Section Title */
        .section-title {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1.5px; color: #A1A1A6;
            margin: 26px 0 12px 0; padding-bottom: 6px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .section-title:first-of-type { margin-top: 0; }

        /* Profile */
        .profile-text { font-size: 12px; line-height: 1.75; color: #525252; }

        /* Experience */
        .exp-block { margin-bottom: 18px; }
        .exp-block:last-child { margin-bottom: 0; }
        .exp-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
        .exp-company { font-size: 15px; font-weight: 600; }
        .exp-role-tag { font-size: 12.5px; color: #86868B; font-weight: 400; }
        .exp-date { font-size: 12px; color: #A1A1A6; white-space: nowrap; }
        .exp-overview { font-size: 12px; color: #525252; line-height: 1.6; margin-bottom: 10px; }

        /* Project Inner Card */
        .project {
            background: #F5F5F7; border-radius: 12px;
            padding: 12px 16px; margin-bottom: 8px;
        }
        .project:last-child { margin-bottom: 0; }
        .project-title { font-size: 12.5px; font-weight: 600; margin-bottom: 3px; }
        .project-meta { font-size: 11px; color: #A1A1A6; font-weight: 400; }
        .project-body { font-size: 11.5px; line-height: 1.7; color: #525252; margin-top: 5px; }
        .project-body ul { list-style: none; padding: 0; margin: 0; }
        .project-body ul li { position: relative; padding-left: 12px; margin-bottom: 3px; }
        .project-body ul li::before {
            content: ''; position: absolute; left: 0; top: 9px;
            width: 5px; height: 5px; border-radius: 50%; background: #C1C1C6;
        }

        /* Page break for second+ company */
        .page-break { page-break-before: always; }

        /* Early Work */
        .early-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .early-item { flex: 1; min-width: 220px; }
        .early-title { font-size: 12.5px; font-weight: 600; }
        .early-detail { font-size: 11.5px; color: #525252; line-height: 1.6; margin-top: 3px; }

        /* Education */
        .edu-grid { display: flex; gap: 30px; flex-wrap: wrap; }
        .edu-item { flex: 1; min-width: 220px; }
        .edu-school { font-size: 13px; font-weight: 600; }
        .edu-detail { font-size: 11.5px; color: #86868B; margin-top: 3px; }

        /* Gaming */
        .gaming-grid { display: flex; flex-direction: column; gap: 8px; }
        .gaming-item { display: flex; gap: 12px; align-items: baseline; }
        .gaming-platform { font-size: 12px; font-weight: 600; color: #1D1D1F; min-width: 100px; }
        .gaming-games { font-size: 11.5px; color: #525252; line-height: 1.6; }

        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }

        .header-info { min-width: 0; }
        .name, .contact-line, .project-body, .exp-overview { overflow-wrap: anywhere; }
        .exp-header { gap: 12px; }
        .section-title { break-after: avoid; }
        .exp-header, .project-title { break-after: avoid; }
        .project-body li, .edu-item, .early-item, .gaming-item { break-inside: avoid; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <img src="{{PHOTO}}" alt="{{NAME}}" class="avatar">
        <div class="header-info">
            <div class="name">{{NAME}}</div>
            <div class="role-line">{{ROLE_LINE}}</div>
            <div class="contact-line">{{CONTACT_LINE}}</div>
        </div>
    </div>

    <!-- START:PROFILE -->
    <div class="section-title">{{PROFILE_TITLE}}</div>
    <p class="profile-text">{{PROFILE}}</p>

    <!-- END:PROFILE -->

        <!-- START:EXPERIENCE -->
    <div class="section-title">{{EXPERIENCE_TITLE}}</div>
    {{EXPERIENCE_SECTIONS}}

    <!-- END:EXPERIENCE -->

        <!-- START:EARLY -->
    <div class="section-title">{{EARLY_SECTION_TITLE}}</div>
    <div class="early-grid">{{EARLY_WORK_ITEMS}}</div>

    <!-- END:EARLY -->

        <!-- START:EDUCATION -->
    <div class="section-title">{{EDUCATION_TITLE}}</div>
    <div class="edu-grid">{{EDUCATION_ITEMS}}</div>

    <!-- END:EDUCATION -->

        <!-- START:GAMING -->
    <div class="section-title">{{GAMING_TITLE}}</div>
    <div class="gaming-grid">{{GAMING_ITEMS}}</div>
<!-- END:GAMING -->
</body>
</html>
