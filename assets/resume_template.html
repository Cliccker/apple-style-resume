<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NAME}} - {{ROLE}}</title>
    {{FONT_LINK}}
    <style>
        :root {
            --bg-primary: #FAFAFA;
            --bg-card: #FFFFFF;
            --bg-secondary: #F5F5F7;
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --text-tertiary: #A1A1A6;
            --accent: #0071E3;
            --accent-light: #E8F4FD;
            --border: rgba(0, 0, 0, 0.06);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
            --shadow-md: 0 4px 24px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.02);
            --shadow-lg: 0 12px 48px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.03);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-full: 9999px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .page { max-width: 960px; margin: 0 auto; padding: 48px 32px; }

        /* Header */
        .header { display: flex; align-items: center; gap: 28px; margin-bottom: 40px; }
        .avatar {
            width: 120px; height: 120px; border-radius: 28px; object-fit: cover;
            box-shadow: var(--shadow-md); flex-shrink: 0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .avatar:hover { transform: scale(1.02); box-shadow: var(--shadow-lg); }
        .header-info { flex: 1; min-width: 0; }
        .name { font-size: 36px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; margin-bottom: 6px; }
        .title-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
        .role { font-size: 16px; font-weight: 500; color: var(--text-secondary); }
        .role-badge {
            display: inline-flex; align-items: center; padding: 4px 14px;
            background: var(--accent-light); color: var(--accent);
            font-size: 13px; font-weight: 600; border-radius: var(--radius-full); letter-spacing: 0.3px;
        }
        .contact-row {
            display: flex; align-items: center; flex-wrap: wrap;
            gap: 6px 18px; font-size: 13.5px; color: var(--text-secondary);
        }
        .contact-row a { color: var(--accent); text-decoration: none; font-weight: 500; transition: opacity 0.2s; }
        .contact-row a:hover { opacity: 0.7; text-decoration: underline; }
        .divider-dot { color: var(--text-tertiary); font-size: 10px; }

        /* Cards */
        .card {
            background: var(--bg-card); border-radius: var(--radius-lg); padding: 32px;
            margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            transition: box-shadow 0.3s ease;
        }
        .card:hover { box-shadow: var(--shadow-md); }
        .card-section-title {
            font-size: 13px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--text-tertiary); margin-bottom: 20px;
        }

        /* Profile */
        .profile-text { font-size: 14px; line-height: 1.8; color: var(--text-secondary); }

        /* Experience */
        .experience-list { display: flex; flex-direction: column; gap: 28px; }
        .exp-item { position: relative; }
        .exp-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 12px; }
        .exp-company { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
        .exp-role-inline { font-size: 14px; font-weight: 400; color: var(--text-secondary); margin-left: 6px; }
        .exp-date { font-size: 13px; color: var(--text-tertiary); white-space: nowrap; flex-shrink: 0; }
        .exp-desc { font-size: 13.5px; line-height: 1.75; color: var(--text-secondary); margin-bottom: 12px; }
        .project-list { display: flex; flex-direction: column; gap: 14px; }
        .project-item { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 16px 20px; }
        .project-title { font-size: 13.5px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .project-meta { font-size: 12px; color: var(--text-tertiary); font-weight: 400; }
        .project-body { font-size: 13px; line-height: 1.7; color: var(--text-secondary); margin-top: 6px; }
        .project-body ul { list-style: none; padding: 0; margin: 0; }
        .project-body ul li { position: relative; padding-left: 14px; margin-bottom: 3px; }
        .project-body ul li::before {
            content: ''; position: absolute; left: 0; top: 10px;
            width: 5px; height: 5px; border-radius: 50%; background: var(--text-tertiary);
        }

        /* Early Work */
        .early-list { display: flex; flex-direction: column; gap: 12px; }
        .early-item { display: flex; gap: 14px; align-items: flex-start; }
        .early-marker { width: 28px; height: 28px; border-radius: 8px; background: var(--bg-secondary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
        .early-marker svg { width: 14px; height: 14px; color: var(--text-secondary); }
        .early-content { flex: 1; }
        .early-title { font-size: 14px; font-weight: 600; }
        .early-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-top: 2px; }

        /* Education */
        .edu-list { display: flex; flex-direction: column; gap: 14px; }
        .edu-item { display: flex; align-items: flex-start; gap: 14px; }
        .edu-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--bg-secondary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .edu-icon svg { width: 18px; height: 18px; color: var(--text-secondary); }
        .edu-content { flex: 1; }
        .edu-school { font-size: 14.5px; font-weight: 600; }
        .edu-major { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

        /* Gaming */
        .gaming-list { display: flex; flex-direction: column; gap: 16px; }
        .gaming-platform { display: flex; flex-direction: column; gap: 6px; }
        .gaming-platform-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .gaming-games { display: flex; flex-wrap: wrap; gap: 6px 12px; }
        .gaming-game { font-size: 13px; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
        .gaming-hours { font-size: 11px; color: var(--text-tertiary); background: var(--bg-secondary); padding: 2px 8px; border-radius: var(--radius-full); }

        /* Footer */
        .footer { text-align: center; padding: 32px 0 16px; font-size: 12px; color: var(--text-tertiary); letter-spacing: 0.5px; }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card { animation: fadeInUp 0.5s ease forwards; opacity: 0; }
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }

        @media print {
            body { background: white !important; }
            .page { padding: 0; max-width: 100%; }
            .card { box-shadow: none !important; border: 1px solid #eee !important; }
            .avatar { box-shadow: none !important; }
        }

        .name, .contact-row, .project-body, .exp-desc { overflow-wrap: anywhere; }
        @media (max-width: 600px) {
            .page { padding: 28px 16px; }
            .header { gap: 16px; align-items: flex-start; margin-bottom: 24px; }
            .avatar { width: 80px; height: 80px; border-radius: 20px; }
            .name { font-size: 28px; }
            .role { font-size: 14px; }
            .card { padding: 22px; }
            .exp-header { flex-wrap: wrap; }
            .exp-role-inline { display: block; margin-left: 0; margin-top: 3px; }
            .contact-row { gap: 6px 10px; }
            .divider-dot { display: none; }
            .project-item { padding: 14px; }
        }
        @media (prefers-reduced-motion: reduce), print {
            .card { animation: none; opacity: 1; transform: none; }
            *, *::before, *::after { transition: none !important; }
        }
    </style>
    <style>{{STYLE_CSS}}</style>
</head>
<body class="resume-web" data-style="{{STYLE}}">
    <div class="page">
        <!-- Header -->
        <header class="header">
            {{AVATAR}}
            <div class="header-info">
                <h1 class="name">{{NAME}}</h1>
                <div class="title-row">
                    <span class="role">{{ROLE}}</span>
                    {{INTENT_ROLE_BADGE}}
                </div>
                <div class="contact-row">
                    {{CONTACT_INFO}}
                </div>
            </div>
        </header>

        <!-- START:PROFILE -->
        <section class="card">
            <div class="card-section-title">{{PROFILE_TITLE}}</div>
            <p class="profile-text">{{PROFILE}}</p>
        </section>

        <!-- END:PROFILE -->

        <!-- START:EXPERIENCE -->
        <section class="card">
            <div class="card-section-title">{{EXPERIENCE_TITLE}}</div>
            <div class="experience-list">
                {{EXPERIENCE_SECTIONS}}
            </div>
        </section>

        <!-- END:EXPERIENCE -->

        <!-- START:EARLY -->
        <section class="card">
            <div class="card-section-title">{{EARLY_SECTION_TITLE}}</div>
            <div class="early-list">
                {{EARLY_WORK_ITEMS}}
            </div>
        </section>

        <!-- END:EARLY -->

        <!-- START:EDUCATION -->
        <section class="card">
            <div class="card-section-title">{{EDUCATION_TITLE}}</div>
            <div class="edu-list">
                {{EDUCATION_ITEMS}}
            </div>
        </section>

        <!-- END:EDUCATION -->

        <!-- START:GAMING -->
        <section class="card">
            <div class="card-section-title">{{GAMING_TITLE}}</div>
            <div class="gaming-list">
                {{GAMING_ITEMS}}
            </div>
        </section>

        <!-- END:GAMING -->
        <footer class="footer">{{FOOTER_TEXT}}</footer>
    </div>
</body>
</html>
